; ────────────────────────────────────────────────────────────────────────
; Production build for the ESP32-L driving the GDEY133F91 panel.
;
; All build flags below are required. String values must be quoted with
; \"...\" so they survive the macro expansion. The header
; src/config/build_config.h #errors out if any are missing.
;
; Wi-Fi credentials and the EPD auth token live in `secrets.ini` (gitignored).
; ────────────────────────────────────────────────────────────────────────
[platformio]
extra_configs = secrets.ini
src_dir = src/firmware
test_dir = test/firmware

[env:esp32-l]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2

build_flags =
    ${secrets.build_flags}
    -DEPD_HOSTNAME=\"display\"
    -DEPD_STATIC_IP=\"192.168.68.200\"
    -DEPD_GATEWAY=\"192.168.68.1\"
    -DEPD_SUBNET=\"255.255.252.0\"


; ────────────────────────────────────────────────────────────────────────
; Host-side test environment for pure-logic units (RefreshMachine).
;   pio test -e native
; ────────────────────────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Isrc/firmware
test_filter = test_state_machine
test_build_src = yes
build_src_filter = -<*> +<app/refresh_machine.cpp>
